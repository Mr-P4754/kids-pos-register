<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景グラデーション -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- メインエメラルドグラデーション -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- シアンアクセントグラデーション -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- ネオングローフィルター -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 角丸正方形背景 -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- 外枠アクセントリング -->
  <rect x="24" y="24" width="464" height="464" rx="84" fill="none" stroke="#334155" stroke-width="4" opacity="0.6" />
  <circle cx="256" cy="220" r="160" fill="none" stroke="url(#cyanGrad)" stroke-width="3" opacity="0.25" />

  <!-- キャッシュレジスター本体 -->
  <g transform="translate(0, -10)">
    <!-- レジ台座（キャッシュドロワー） -->
    <rect x="136" y="270" width="240" height="74" rx="12" fill="#334155" stroke="#475569" stroke-width="4" />
    <!-- ドロワー引き出しライン -->
    <line x1="140" y1="305" x2="372" y2="305" stroke="#1e293b" stroke-width="3" />
    <!-- ドロワー鍵穴・取っ手 -->
    <rect x="236" y="285" width="40" height="6" rx="3" fill="#10b981" />

    <!-- レジボディ（スラント型） -->
    <polygon points="160,150 352,150 376,270 136,270" fill="#1e293b" stroke="#334155" stroke-width="4" />

    <!-- レジ上部ディスプレイ画面 -->
    <rect x="180" y="166" width="152" height="54" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="3" />
    <!-- ディスプレイ数字表示 -->
    <text x="256" y="203" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#6ee7b7" text-anchor="middle">¥ 0</text>

    <!-- キーパッドボタン群 -->
    <g fill="#475569" opacity="0.9">
      <rect x="176" y="234" width="24" height="18" rx="4" />
      <rect x="210" y="234" width="24" height="18" rx="4" />
      <rect x="244" y="234" width="24" height="18" rx="4" />
      <rect x="278" y="234" width="24" height="18" rx="4" />
      <rect x="312" y="234" width="24" height="18" rx="4" fill="#10b981" />
    </g>

    <!-- レジ側面のバーコードリーダー／スキャナ光 -->
    <line x1="150" y1="130" x2="162" y2="150" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <circle cx="147" cy="126" r="6" fill="#38bdf8" />
  </g>

  <!-- バーコードシンボル（中央下部） -->
  <g transform="translate(136, 360)">
    <rect x="0" y="0" width="240" height="42" rx="6" fill="#ffffff" />
    <!-- バーコード黒線群 -->
    <rect x="14" y="6" width="6" height="30" fill="#0f172a" />
    <rect x="26" y="6" width="3" height="30" fill="#0f172a" />
    <rect x="34" y="6" width="8" height="30" fill="#0f172a" />
    <rect x="48" y="6" width="4" height="30" fill="#0f172a" />
    <rect x="58" y="6" width="10" height="30" fill="#0f172a" />
    <rect x="74" y="6" width="4" height="30" fill="#0f172a" />
    <rect x="84" y="6" width="7" height="30" fill="#0f172a" />
    <rect x="97" y="6" width="4" height="30" fill="#0f172a" />
    <rect x="107" y="6" width="10" height="30" fill="#0f172a" />
    <rect x="123" y="6" width="5" height="30" fill="#0f172a" />
    <rect x="134" y="6" width="8" height="30" fill="#0f172a" />
    <rect x="148" y="6" width="4" height="30" fill="#0f172a" />
    <rect x="158" y="6" width="11" height="30" fill="#0f172a" />
    <rect x="175" y="6" width="4" height="30" fill="#0f172a" />
    <rect x="185" y="6" width="8" height="30" fill="#0f172a" />
    <rect x="199" y="6" width="5" height="30" fill="#0f172a" />
    <rect x="210" y="6" width="6" height="30" fill="#0f172a" />
    <rect x="220" y="6" width="6" height="30" fill="#0f172a" />
  </g>

  <!-- タイトルバッジ「POS REG」 -->
  <text x="256" y="448" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="4" fill="url(#cyanGrad)" text-anchor="middle">
    POS REG
  </text>
  <text x="256" y="474" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#94a3b8" text-anchor="middle">
    STANDALONE SYSTEM
  </text>
</svg>
